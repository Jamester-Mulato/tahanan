name: tahanan
description: Tahanan boarding-house management app.
publish_to: none
version: 1.0.0+20261113

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.3.0
  google_fonts: ^6.2.1
  http: ^1.5.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_secure_storage: ^11.2.0
  webview_flutter: ^4.14.1
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/lottie/
