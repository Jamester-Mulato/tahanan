services:
  postgres:
    image: postgres:16-alpine
    container_name: tahanan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tahanan
      POSTGRES_USER: tahanan
      POSTGRES_PASSWORD: tahanan_password
    ports:
      - "5432:5432"
    volumes:
      - tahanan_pgdata:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro

volumes:
  tahanan_pgdata:
